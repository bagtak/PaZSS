<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaZSS Tournament Manager</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PaZSS">
<meta name="theme-color" content="#0b6e3c"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eef4f0;--card:#fff;--tx:#10231a;--mu:#5d7168;--ac:#0fa958;--on:#fff;--gold:#f5b700;--bd:#dce7e1;--rd:#e5484d;--in:#f3f7f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07120d;--card:#102019;--tx:#eaf7f0;--mu:#8fa89b;--ac:#27e08a;--on:#04210f;--gold:#ffcf33;--bd:#1b3328;--in:#0a1812;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07120d;--card:#102019;--tx:#eaf7f0;--mu:#8fa89b;--ac:#27e08a;--on:#04210f;--gold:#ffcf33;--bd:#1b3328;--in:#0a1812;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 14px 110px}
h1,h2,h3,p{margin:0}.mu{color:var(--mu)}small{font-size:12px}
.hero{background:repeating-linear-gradient(90deg,#0b6e3c 0 38px,#0e7a44 38px 76px);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 10px 28px #0b6e3c55;position:relative;overflow:hidden}
.hero small{opacity:.8;letter-spacing:1px}.hero h2{font-size:22px;margin-top:2px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 16px #0000000d}
.tap{cursor:pointer}.tap:active{transform:scale(.98)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;margin:5px 0}
.b,.b2{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;background:var(--ac);color:var(--on);cursor:pointer;margin:5px 0}
.b2{background:transparent;border:1.5px solid var(--ac);color:var(--ac)}.w{width:100%}.bdg{background:var(--rd);color:#fff}
.ib{border:0;background:#ffffff30;color:inherit;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
.card .ib{background:var(--in)}
.badge{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--gold));display:grid;place-items:center;font-size:24px}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--gold));color:var(--on);font-size:32px;box-shadow:0 8px 22px #0006;cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:var(--mu);font-size:15px}.empty{line-height:2}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:6px;border-radius:12px;cursor:pointer}
.nav button span{display:block;font-size:20px}.nav .on{color:var(--ac);background:var(--in);font-weight:700}
.login{text-align:center;padding-top:5vh}.lgbig{width:240px;max-width:75%;filter:drop-shadow(0 10px 18px #0005);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.lgs{height:46px;width:auto;background:#fff;border-radius:14px;padding:3px 6px}
.login h1{font-size:34px;font-weight:900;margin-top:8px}.login h1 span{color:var(--ac)}.login .card{text-align:left;margin-top:24px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.mrow{display:flex;align-items:center;gap:8px;font-weight:700}.tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tn.r{text-align:right}
.sc{background:var(--in);padding:6px 12px;border-radius:10px;min-width:64px;text-align:center;font-size:17px}
.sub{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--in);color:var(--mu);margin-top:6px}
.sub.ok{background:var(--ac);color:var(--on)}
h4{margin:16px 2px 4px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 4px;text-align:center}th{color:var(--mu);font-size:11px}td:nth-child(2),th:nth-child(2){text-align:left}tr+tr td{border-top:1px solid var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.chip i{font-style:normal;font-weight:800;background:var(--bd);border-radius:8px;padding:1px 6px}.chip em{font-style:normal;font-size:10px;font-weight:800}
.c1{border-color:var(--ac);background:var(--ac);color:var(--on)}.c1 i{background:#0003}.c2{border-color:var(--gold);color:var(--gold)}
.big{font-size:38px;font-weight:900;text-align:center}
.ev{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}.ev b{width:42px;color:var(--ac)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}.prow i{font-style:normal;font-weight:800;background:var(--ac);color:var(--on);border-radius:10px;min-width:34px;text-align:center;padding:3px}
.br{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.bc{min-width:170px}.bc h5{margin:0 0 6px;color:var(--gold)}
.bm{background:var(--in);border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:13px}.bm div{display:flex;justify-content:space-between;gap:8px}.bm .wn{font-weight:800;color:var(--ac)}
.champ{background:linear-gradient(135deg,#f5b700,#ff8a00);color:#2a1a00;text-align:center;border-radius:20px;padding:18px;margin:10px 0;font-weight:800}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.3s;z-index:20;pointer-events:none;font-size:14px}
</style></head><body>
<div id="app"></div><div id="modal" onclick="if(event.target===this)closeM()"></div><div id="toast"></div>

/* ---------- Auth ---------- */
function loginV(){const s=!db.admin;return `<div class="login"><img class="lgbig" src="${LOGO}" alt="PaZSS"><h1>Pa<span>ZSS</span></h1><p class="mu">Tournament Manager</p><div class="card"><b>${s?'Create your admin account':'Admin sign in'}</b><input id="lu" placeholder="Username" autocapitalize="off"><input id="lp" type="password" placeholder="Password"><button class="b w" onclick="login()">${s?'Create account':'Sign in'}</button></div></div>`}
function login(){const u=V('lu'),p=document.getElementById('lp').value;if(!u||p.length<4)return toast('Enter a username and a 4+ character password');
 if(!db.admin){db.admin={u,p:hash(p)};save()}else if(db.admin.u!==u||db.admin.p!==hash(p))return toast('Wrong username or password');ses=true;render()}

/* ---------- Home ---------- */
function homeV(){return `<div class="hero"><div class="row"><img class="lgs" src="${LOGO}" alt=""><div class="sp"><small>PaZSS · ${esc(db.admin.u)}</small><h2>My Tournaments</h2></div><button class="ib" onclick="ses=false;render()">⎋</button></div></div>`+
(db.ts.map(t=>{const d=t.matches.filter(m=>m.done).length;return `<div class="card tap" onclick="ui.tid='${t.id}';ui.tab='teams';render()"><div class="row"><div class="badge">${t.fmt=='ko'?'🏅':'⚽'}</div><div class="sp"><b>${esc(t.name)}</b><div class="mu"><small>${fmtName(t)} · ${t.teams.length} teams · ${d}/${t.matches.length} played</small></div></div><span class="mu">›</span></div></div>`}).join('')||'<div class="empty">⚽<br>No tournaments yet.<br>Tap + to create your first one!</div>')+'<button class="fab" onclick="newT()">+</button>'}
function newT(){openM(`<h3>New tournament</h3><input id="tnm" placeholder="Tournament name"><select id="tf"><option value="rr1">Round Robin · Single</option><option value="rr2">Round Robin · Double (home &amp; away)</option><option value="ko">Knockout Bracket</option></select><button class="b w" onclick="saveT()">Create</button>`)}
function saveT(){const n=V('tnm');if(!n)return toast('Enter a tournament name');const t={id:uid(),name:n,fmt:V('tf'),teams:[],matches:[],started:false,champ:null};db.ts.unshift(t);save();closeM();ui.tid=t.id;ui.tab='teams';render()}
function delT(){db.ts=db.ts.filter(x=>x.id!==ui.tid);ui.tid=null;save();render()}

/* ---------- Tournament ---------- */
function tourV(){const t=T(),tabs=[['teams','👥','Teams'],['fix','📅','Matches'],['tbl',t.fmt=='ko'?'🏅':'📊',t.fmt=='ko'?'Bracket':'Table'],['rep','📄','Report']];
const b={teams:teamsB,fix:fixB,tbl:tblB,rep:repB}[ui.tab](t);
return `<div class="hero"><div class="row"><button class="ib" onclick="ui.tid=null;render()">‹</button><div class="sp"><small>${fmtName(t).toUpperCase()}</small><h2>${esc(t.name)}</h2></div><button class="ib" onclick="ask('Delete this tournament?',delT)">🗑</button></div></div>${b}<div class="nav">${tabs.map(x=>`<button class="${ui.tab==x[0]?'on':''}" onclick="ui.tab='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`}
function teamsB(t){return (t.teams.map(x=>`<div class="card tap" onclick="teamM('${x.id}')"><div class="row"><span class="dot" style="background:${x.col}"></span><b class="sp">${esc(x.name)}</b><span class="mu">${x.pl.length} players ›</span></div></div>`).join('')||'<div class="empty">👥<br>Add the teams to begin</div>')+
(t.started?'<p class="mu" style="text-align:center"><small>Tournament started · teams are locked</small></p>':`<div class="card"><b>Add team</b><input id="tmn" placeholder="Team name"><button class="b w" onclick="addTm()">+ Add team</button></div>`+(t.teams.length>1?`<button class="b w" onclick="startT()">🚀 Start tournament (${t.teams.length} teams)</button>`:''))}
function addTm(){const t=T(),n=V('tmn');if(!n)return toast('Enter a team name');t.teams.push({id:uid(),name:n,col:PAL[t.teams.length%PAL.length],pl:[]});save();render()}
function delTm(id){const t=T();t.teams=t.teams.filter(x=>x.id!==id);save();render()}
function teamM(id){const t=T(),x=tm(t,id);openM(`<div class="row"><b class="sp" style="font-size:18px;color:${x.col}">● ${esc(x.name)}</b><button class="ib" onclick="closeM()">✕</button></div>${x.pl.map(p=>`<div class="prow"><i>${p.no}</i><span class="sp">${esc(p.name)} <small class="mu">${p.pos}</small></span><button class="ib" onclick="delP('${id}','${p.id}')">✕</button></div>`).join('')||'<p class="mu" style="margin:10px 0">No players yet.</p>'}<h4>Add player</h4><input id="pn" placeholder="Player name"><div class="row"><input id="pj" type="number" inputmode="numeric" placeholder="Jersey #"><select id="pp"><option>GK</option><option>DF</option><option selected>MF</option><option>FW</option></select></div><button class="b w" onclick="addP('${id}')">+ Add player</button>${t.started?'':`<button class="b2 w" onclick="ask('Remove this team?',()=>delTm('${id}'))">Remove team</button>`}`)}
function addP(id){const t=T(),x=tm(t,id),n=V('pn'),no=parseInt(V('pj'));if(!n||!(no>=0))return toast('Enter name and jersey number');if(x.pl.some(p=>p.no==no))return toast('Jersey #'+no+' is already taken');x.pl.push({id:uid(),name:n,no,pos:V('pp')});x.pl.sort((a,b)=>a.no-b.no);save();teamM(id);render()}
function delP(tid,pid){const x=tm(T(),tid);x.pl=x.pl.filter(p=>p.id!==pid);save();teamM(tid)}

/* ---------- Fixtures ---------- */
const mk=(r,lab,h,a,bye)=>({id:uid(),r,lab,h,a,hs:0,as:0,done:!!bye,bye:!!bye,lu:{h:{},a:{}},g:[],c:[],pw:null});
function rr(ids,dbl){let l=ids.slice();if(l.length%2)l.push(null);const n=l.length,out=[];
 for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=l[i],b=l[n-1-i];if(a&&b)pr.push(r%2?[b,a]:[a,b])}out.push(pr);l=[l[0],l[n-1],...l.slice(1,n-1)]}
 const all=out.map((p,i)=>({lab:'Matchday '+(i+1),p}));
 if(dbl)out.forEach((p,i)=>all.push({lab:'Matchday '+(out.length+i+1),p:p.map(x=>[x[1],x[0]])}));
 return all.flatMap((d,i)=>d.p.map(x=>mk(i+1,d.lab,x[0],x[1])))}
const koLab=n=>n==2?'Final':n==4?'Semi-finals':n==8?'Quarter-finals':'Round of '+n;
function koFirst(ids){const s=[...ids].sort(()=>Math.random()-.5);let z=2;while(z<s.length)z*=2;const by=z-s.length,o=[];
 s.slice(0,by).forEach(h=>o.push(mk(1,koLab(z),h,null,true)));
 for(let i=by;i<s.length;i+=2)o.push(mk(1,koLab(z),s[i],s[i+1]));return o}
function koNext(w,r){const o=[];for(let i=0;i<w.length;i+=2)o.push(mk(r,koLab(w.length),w[i],w[i+1]));return o}
function startT(){const t=T(),ids=t.teams.map(x=>x.id);t.matches=t.fmt=='ko'?koFirst(ids):rr(ids,t.fmt=='rr2');t.started=true;if(t.fmt=='ko')adv(t);save();ui.tab='fix';toast('Fixtures generated!');render()}
const win=m=>m.bye?m.h:m.hs>m.as?m.h:m.as>m.hs?m.a:(m.pw=='h'?m.h:m.a);
function adv(t){const r=Math.max(...t.matches.map(m=>m.r)),rm=t.matches.filter(m=>m.r==r);if(!rm.every(m=>m.done))return;const w=rm.map(win);if(w.length==1)t.champ=w[0];else t.matches.push(...koNext(w,r+1))}
const recalc=m=>{m.hs=m.g.filter(g=>(g.s=='h')!=!!g.og).length;m.as=m.g.length-m.hs};
function fixB(t){if(!t.matches.length)return '<div class="empty">📅<br>Start the tournament to generate fixtures</div>';const gr=[];t.matches.forEach(m=>{let g=gr.find(x=>x.l==m.lab);if(!g)gr.push(g={l:m.lab,m:[]});g.m.push(m)});
return gr.map(g=>`<h4>${esc(g.l)}</h4>`+g.m.map(m=>`<div class="card tap" onclick="${m.bye?'':`ui.mid='${m.id}';render()`}"><div class="mrow"><span class="tn r">${esc(tn(t,m.h))}</span><span class="sc">${m.bye?'BYE':(m.done||m.g.length)?m.hs+' – '+m.as:'vs'}</span><span class="tn">${esc(tn(t,m.a))}</span></div><span class="sub ${m.done?'ok':''}">${m.bye?'Advances automatically':m.done?'Full time'+(m.pw?' · pens':''):m.g.length?'In progress':'Scheduled'}</span></div>`).join('')).join('')}

/* ---------- Table / Bracket / Stats ---------- */
function stand(t){const r={};t.teams.forEach(x=>r[x.id]={t:x,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
 t.matches.filter(m=>m.done&&!m.bye).forEach(m=>{const h=r[m.h],a=r[m.a];h.p++;a.p++;h.gf+=m.hs;h.ga+=m.as;a.gf+=m.as;a.ga+=m.hs;if(m.hs>m.as){h.w++;a.l++;h.pts+=3}else if(m.hs<m.as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}});
 return Object.values(r).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf)}
function scorers(t){const o={};t.matches.forEach(m=>m.g.forEach(g=>{if(g.og)return;const k=m[g.s]+g.pid;o[k]=o[k]||{n:g.pn,no:g.no,tm:tn(t,m[g.s]),c:0};o[k].c++}));return Object.values(o).sort((a,b)=>b.c-a.c)}
function cards(t){const o=[];t.matches.forEach(m=>m.c.forEach(c=>o.push({...c,tm:tn(t,m[c.s]),vs:tn(t,m.h)+' v '+tn(t,m.a)})));return o}
const champ=t=>{if(t.fmt=='ko')return t.champ;return t.matches.length&&t.matches.every(m=>m.done)?stand(t)[0].t.id:null};
function tblB(t){if(!t.matches.length)return '<div class="empty">📊<br>Nothing to show yet</div>';let h='';const ch=champ(t);
 if(ch)h+=`<div class="champ">🏆 CHAMPIONS<br><span style="font-size:24px">${esc(tn(t,ch))}</span></div>`;
 if(t.fmt=='ko'){const rs=[...new Set(t.matches.map(m=>m.r))];h+=`<div class="card"><div class="br">${rs.map(r=>{const ms=t.matches.filter(m=>m.r==r);return `<div class="bc"><h5>${esc(ms[0].lab)}</h5>${ms.map(m=>{const w=m.done?win(m):null;return `<div class="bm"><div class="${w&&w==m.h?'wn':''}"><span>${esc(tn(t,m.h))}</span><span>${m.done&&!m.bye?m.hs:''}</span></div><div class="${w&&w==m.a?'wn':''}"><span>${esc(tn(t,m.a))}</span><span>${m.done&&!m.bye?m.as:''}</span></div></div>`}).join('')}</div>`}).join('')}</div></div>`}
 else h+=`<div class="card"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${stand(t).map((r,i)=>`<tr><td>${i+1}</td><td><span class="dot" style="background:${r.t.col}"></span> <b>${esc(r.t.name)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table></div>`;
 const sc=scorers(t).slice(0,8);h+='<h4>⚽ Top scorers</h4><div class="card">'+(sc.map((s,i)=>`<div class="prow"><i>${i+1}</i><span class="sp">${esc(s.n)} <small class="mu">#${s.no} · ${esc(s.tm)}</small></span><b>${s.c}</b></div>`).join('')||'<span class="mu">No goals yet</span>')+'</div>';
 const cd=cards(t);h+=`<h4>Discipline</h4><div class="card"><div class="row"><span class="sp">🟨 Yellow cards</span><b>${cd.filter(c=>c.t=='y').length}</b></div><div class="row"><span class="sp">🟥 Red cards</span><b>${cd.filter(c=>c.t=='r').length}</b></div></div>`;return h}

/* ---------- Match ---------- */
function plOpts(t,m,s){const x=tm(t,m[s]),L=m.lu[s],has=Object.keys(L).length;return x.pl.filter(p=>!has||L[p.id]).map(p=>`<option value="${p.id}">#${p.no} ${esc(p.name)}${L[p.id]==2?' (sub)':''}</option>`).join('')}
function matchV(){const t=T(),m=Mt(t),H=tm(t,m.h),A=tm(t,m.a);
 const lu=(s,X)=>{const L=m.lu[s],v=Object.values(L);return `<div class="card"><b style="color:${X.col}">● ${esc(X.name)}</b> <small class="mu">XI ${v.filter(x=>x==1).length}/11 · Subs ${v.filter(x=>x==2).length}</small><div class="chips">${X.pl.map(p=>`<button class="chip c${L[p.id]||0}" onclick="cyc('${s}','${p.id}')"><i>${p.no}</i>${esc(p.name)}<em>${['','XI','SUB'][L[p.id]||0]}</em></button>`).join('')||'<small class="mu">No players in this team</small>'}</div></div>`};
 const evs=[...m.g.map(g=>({k:'g',e:g})),...m.c.map(c=>({k:'c',e:c}))].sort((a,b)=>a.e.min-b.e.min);
 const sideSel=(id,cur,fn)=>`<select id="${id}" onchange="${fn}=this.value;render()"><option value="h" ${cur=='h'?'selected':''}>${esc(H.name)}</option><option value="a" ${cur=='a'?'selected':''}>${esc(A.name)}</option></select>`;
 return `<div class="hero"><div class="row"><button class="ib" onclick="ui.mid=null;render()">‹</button><small class="sp" style="text-align:center">${esc(m.lab).toUpperCase()}</small><span style="width:38px"></span></div><div class="row" style="margin-top:10px"><b class="sp" style="text-align:center">${esc(H.name)}</b><span class="big">${m.hs} – ${m.as}</span><b class="sp" style="text-align:center">${esc(A.name)}</b></div></div>
 <h4>Lineups <span style="text-transform:none;letter-spacing:0">(tap: XI → Sub → off)</span></h4>${lu('h',H)}${lu('a',A)}
 <h4>⚽ Goals</h4><div class="card">${sideSel('gs',ui.gs,'ui.gs')}<select id="gp">${plOpts(t,m,ui.gs)}</select><input id="gm" type="number" inputmode="numeric" placeholder="Minute (e.g. 23)"><label class="row"><input id="go" type="checkbox" style="width:auto"> Own goal</label><button class="b w" onclick="addG()">+ Add goal</button></div>
 <h4>🟨🟥 Cards</h4><div class="card">${sideSel('cs',ui.cs,'ui.cs')}<select id="cp">${plOpts(t,m,ui.cs)}</select><select id="ct"><option value="y">🟨 Yellow card</option><option value="r">🟥 Red card</option></select><input id="cm" type="number" inputmode="numeric" placeholder="Minute"><button class="b w" onclick="addC()">+ Add card</button></div>
 <h4>Match events</h4><div class="card">${evs.map(x=>{const e=x.e;return `<div class="ev"><b>${e.min}’</b><span class="sp">${x.k=='g'?'⚽':e.t=='y'?'🟨':'🟥'} #${e.no} ${esc(e.pn)} <small class="mu">${esc(tn(t,m[e.s]))}${e.og?' · own goal':''}</small></span><button class="ib" onclick="delEv('${x.k}','${e.id}')">✕</button></div>`}).join('')||'<span class="mu">No events yet</span>'}</div>
 ${t.fmt=='ko'&&m.hs==m.as&&!m.done?`<div class="card"><b>Tied · penalty winner</b><select onchange="Mt(T()).pw=this.value||null;save()"><option value="">Select…</option><option value="h" ${m.pw=='h'?'selected':''}>${esc(H.name)}</option><option value="a" ${m.pw=='a'?'selected':''}>${esc(A.name)}</option></select></div>`:''}
 ${m.done?'<button class="b2 w" onclick="reopen()">Reopen match</button>':'<button class="b w" onclick="finish()">✔ Finish match</button>'}`}
function cyc(s,pid){const m=Mt(T()),L=m.lu[s];let v=(L[pid]||0)+1;if(v==1&&Object.values(L).filter(x=>x==1).length>=11)v=2;if(v>2)v=0;v?L[pid]=v:delete L[pid];save();render()}
function addG(){const t=T(),m=Mt(t),pid=V('gp'),mn=V('gm');if(!pid||mn===''||+mn<0)return toast('Pick a player and enter the minute');const p=tm(t,m[ui.gs]).pl.find(x=>x.id==pid);m.g.push({id:uid(),s:ui.gs,pid,pn:p.name,no:p.no,min:+mn,og:document.getElementById('go').checked});recalc(m);save();render()}
function addC(){const t=T(),m=Mt(t),pid=V('cp'),mn=V('cm');if(!pid||mn===''||+mn<0)return toast('Pick a player and enter the minute');const p=tm(t,m[ui.cs]).pl.find(x=>x.id==pid);m.c.push({id:uid(),s:ui.cs,pid,pn:p.name,no:p.no,min:+mn,t:V('ct')});save();render()}
function delEv(k,id){const m=Mt(T());if(k=='g'){m.g=m.g.filter(x=>x.id!=id);recalc(m)}else m.c=m.c.filter(x=>x.id!=id);save();render()}
function finish(){const t=T(),m=Mt(t);if(t.fmt=='ko'&&m.hs==m.as&&!m.pw)return toast('Select the penalty winner');m.done=true;if(t.fmt=='ko')adv(t);save();toast('Full time ✔');ui.mid=null;ui.tab=t.champ||champ(t)?'tbl':'fix';render()}
function reopen(){const t=T(),m=Mt(t);if(t.fmt=='ko'&&t.matches.some(x=>x.r>m.r))return toast('Next round already created');m.done=false;t.champ=null;save();render()}

/* ---------- Report + PDF ---------- */
function repB(t){const ms=t.matches,d=ms.filter(m=>m.done&&!m.bye),gl=d.reduce((a,m)=>a+m.hs+m.as,0),ch=champ(t);
 return (ch?`<div class="champ">🏆 CHAMPIONS<br><span style="font-size:24px">${esc(tn(t,ch))}</span></div>`:'')+`<div class="card"><div class="row"><span class="sp">Matches played</span><b>${d.length}/${ms.filter(m=>!m.bye).length}</b></div><div class="row"><span class="sp">Goals scored</span><b>${gl}</b></div><div class="row"><span class="sp">Goals per match</span><b>${d.length?(gl/d.length).toFixed(2):'0'}</b></div><div class="row"><span class="sp">Cards (🟨/🟥)</span><b>${cards(t).filter(c=>c.t=='y').length} / ${cards(t).filter(c=>c.t=='r').length}</b></div></div>
 <button class="b w" onclick="pdf()">📄 Generate PDF report</button><p class="mu" style="text-align:center"><small>${ch?'Final report with champion, results and statistics.':'Tournament still in progress — the report will show current standings.'}</small></p>`}
async function pdf(){const t=T();if(!window.jspdf)return toast('PDF library not loaded');const d=new window.jspdf.jsPDF();let y=0;
 const nl=n=>{y+=n;if(y>282){d.addPage();y=20}};
 d.setFillColor(11,110,60);d.rect(0,0,210,38,'F');d.setFillColor(255,255,255);d.roundedRect(160,5,40,28,3,3,'F');try{d.addImage(LOGO,'PNG',162,6,36,26)}catch(e){}d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(20);d.text(t.name,14,18,{maxWidth:140});d.setFont('helvetica','normal');d.setFontSize(10);d.text('PaZSS Regional Football Association  |  '+fmtName(t)+'  |  '+t.teams.length+' teams  |  '+new Date().toLocaleDateString(),14,29,{maxWidth:140});
 d.setTextColor(20);y=50;
 const H=s=>{nl(4);d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(11,110,60);d.text(s,14,y);d.setTextColor(20);d.setFont('helvetica','normal');d.setFontSize(10);nl(8)};
 const row=(c,xs,b)=>{d.setFont('helvetica',b?'bold':'normal');c.forEach((v,i)=>d.text(String(v),xs[i],y));nl(6)};
 const ch=champ(t);if(ch){d.setFont('helvetica','bold');d.setFontSize(16);d.setTextColor(200,120,0);d.text('CHAMPIONS: '+tn(t,ch),14,y);d.setTextColor(20);d.setFontSize(10);nl(6)}
 if(t.fmt!='ko'){H('Final standings');const xs=[14,24,100,115,130,145,160,178];row(['#','Team','P','W','D','L','GD','Pts'],xs,1);stand(t).forEach((r,i)=>row([i+1,r.t.name,r.p,r.w,r.d,r.l,r.gf-r.ga,r.pts],xs))}
 H('Results');let lab='';t.matches.filter(m=>!m.bye).forEach(m=>{if(m.lab!=lab){lab=m.lab;nl(2);row([lab],[14],1)}
  row([tn(t,m.h)+'  '+(m.done||m.g.length?m.hs+' - '+m.as:'vs')+'  '+tn(t,m.a)+(m.pw?'  (pens: '+tn(t,m[m.pw=='h'?'h':'a'])+')':'')],[18]);
  const ev=[...m.g.map(g=>({min:g.min,x:'Goal  #'+g.no+' '+g.pn+(g.og?' (OG)':'')+' ['+tn(t,m[g.s])+']'})),...m.c.map(c=>({min:c.min,x:(c.t=='y'?'Yellow':'RED')+'  #'+c.no+' '+c.pn+' ['+tn(t,m[c.s])+']'}))].sort((a,b)=>a.min-b.min);
  d.setFontSize(8);d.setTextColor(90);ev.forEach(e=>{d.text(e.min+"'  "+e.x,24,y);nl(4.5)});d.setFontSize(10);d.setTextColor(20);nl(1)});
 H('Top scorers');const sx=[14,24,100,170];row(['#','Player','Team','Goals'],sx,1);scorers(t).slice(0,10).forEach((s,i)=>row([i+1,'#'+s.no+' '+s.n,s.tm,s.c],sx));
 H('Cards');const cx=[14,30,100,135];row(['Min','Player','Team','Card'],cx,1);cards(t).sort((a,b)=>a.min-b.min).forEach(c=>row([c.min+"'",'#'+c.no+' '+c.pn,c.tm,c.t=='y'?'Yellow':'Red'],cx));
 let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(!dl){const u=URL.createObjectURL(d.output('blob')),a=document.createElement('a');a.href=u;a.download=t.name.replace(/[^\w-]+/g,'_')+'_report.pdf';document.body.appendChild(a);a.click();a.remove();toast('PDF ready');return}
 try{await dl.save({filename:t.name.replace(/[^\w-]+/g,'_')+'_report.pdf',data:d.output('blob')})}catch(e){if(!e||e.code!='declined')toast('Could not save the PDF')}}
